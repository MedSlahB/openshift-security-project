---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: security-scan
  namespace: cicd
spec:
  params:
  - name: image
    type: string
  steps:
  - name: scan
    image: aquasec/trivy:latest
    script: |
      #!/bin/sh
      set -eu
      echo "Scanning image: $(params.image)"
      trivy image --severity HIGH,CRITICAL --exit-code 1 "$(params.image)"
      echo "Scan completed with the configured severity threshold"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: verify-deployment
  namespace: cicd
spec:
  params:
  - name: namespace
    type: string
  - name: deployment
    type: string
  steps:
  - name: verify
    image: quay.io/openshift/origin-cli:latest
    script: |
      #!/bin/bash
      set -e
      echo "Verifying deployment $(params.deployment) in $(params.namespace)"
      oc rollout status deployment/$(params.deployment) -n $(params.namespace) --timeout=5m
      oc wait --for=condition=available --timeout=300s deployment/$(params.deployment) -n $(params.namespace)
      echo "Deployment verified successfully"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-tests
  namespace: cicd
spec:
  workspaces:
  - name: source
  steps:
  - name: test
    image: python:3.9-slim
    workingDir: $(workspaces.source.path)/application/vulnerable-app
    script: |
      #!/bin/sh
      set -eu
      python -m pip install --disable-pip-version-check -q -r requirements.txt
      python -m unittest discover -s tests -p 'test_*.py' -v
